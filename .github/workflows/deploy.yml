name: Deploy to Cloudflare Pages

# Autonomous deploy. Once CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID exist as
# repository secrets, every push to a release branch runs the full pipeline
# without human involvement: verify, pull fresh CMS data, deploy.
#
# The ETL runs HERE rather than being committed, because GitHub runners have the
# outbound network access to CMS that the authoring environment did not. This is
# also what keeps premiums current: re-running the workflow after CMS publishes a
# plan year is the entire data refresh procedure.

on:
  push:
    branches:
      - main
      - "claude/aca-marketplace-subsidy-estimator-**"
  workflow_dispatch:
    inputs:
      planYear:
        description: "Plan year to build benchmark data for"
        type: choice
        options:
          - "2026"
        required: false
        default: "2026"
  schedule:
    # Weekly refresh. CMS revises public use files in-year, and this keeps the
    # deployed premiums from silently drifting away from the published files.
    - cron: "0 11 * * 1"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  deploy:
    name: Build data and deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      PLAN_YEAR: ${{ github.event.inputs.planYear || '2026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build benchmark data from CMS public use files
        id: etl
        continue-on-error: true
        run: npm run etl -- --plan-year="$PLAN_YEAR" --out=public/data

      - name: Report data status
        id: data-status
        env:
          ETL_OUTCOME: ${{ steps.etl.outcome }}
        run: |
          DATA_DIR="public/data/$PLAN_YEAR"
          COUNT=0
          if [ -d "$DATA_DIR" ]; then
            COUNT=$(find "$DATA_DIR" -maxdepth 1 -type f -name '*.json' ! -name 'index.json' | wc -l)
          fi
          if [ "$COUNT" -gt 0 ]; then
            echo "::notice::Found $COUNT shard files for plan year $PLAN_YEAR (ETL outcome: $ETL_OUTCOME)."
            echo "### Benchmark data: $COUNT shard files available (ETL: $ETL_OUTCOME)" >> "$GITHUB_STEP_SUMMARY"
            echo "shards_empty=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ETL produced no shards. Deploying anyway — the API will \
            return an honest 'dataset-not-loaded' rather than an invented premium. \
            Check whether CMS has published this plan year yet."
            echo "### Benchmark data: NONE — API will report data unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "shards_empty=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Guard against shipping synthetic premiums
        run: |
          if grep -rl "SYNTHETIC" public/data 2>/dev/null; then
            echo "::error::Synthetic fixture data found in the deploy artifact. Refusing to deploy."
            exit 1
          fi
          echo "No synthetic data in the artifact."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.143.0"
          command: pages deploy public --project-name=subsidy-dropoff --branch=${{ github.ref_name }}

      # Keep CMS refresh failures visible even when committed shards allow the
      # deployment to proceed with the last known data.
      - name: Alert on deploy failure, CMS refresh failure, or empty dataset
        if: failure() || steps.etl.outcome == 'failure' || steps.data-status.outputs.shards_empty == 'true'
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy issue: run ${{ github.run_id }} (${{ github.event_name }} on ${{ github.ref_name }})" \
            --body "Workflow failed, the CMS refresh failed, or no benchmark shards were available at $(date -u +%FT%TZ). See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || echo "::error::Could not create an alert issue — check that GITHUB_TOKEN has issues:write for this repo."
        env:
          GH_TOKEN: ${{ github.token }}
